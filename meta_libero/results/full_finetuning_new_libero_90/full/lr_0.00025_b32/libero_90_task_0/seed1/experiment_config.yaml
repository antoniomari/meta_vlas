model:
  use_base_model: false
  use_lora: false
  action_expert_only: false
  libero_90_dataset: true
ttt:
  learning_rate: 0.00025
  ttt_num_steps: 10
  ttt_frequency: 50
  k: 50
  ttt_max_step: 1000
  use_modalities: null
  repeat_batch: 1
  reset_policy: true
  random_neighbors: false
  cfg_weight: 1.0
  noise_ttt: false
eval:
  num_trials: 50
  task_suite_name: libero_90
  task_id: 0
  num_steps_wait: 10
  save_video: true
  video_out_path: data/libero/videos
  seed: 1
  plot_observations: false
  use_test_task: false
finetune:
  learning_rate: 0.00025
  num_steps: 500
  eval_interval: 100
  batch_size: 32
  warmup_steps: 0
  weight_decay: 0.0
  log_interval: 100
  seed: 1
  donate_buffers: true
  skip_first_eval: false
noise:
  sigma: 0.01
  frequency: 50
  max_step: 150
